# The NFL builder: heavy data processing outside the Worker.
#
# It downloads the nflverse files, derives the weekly and as-of tables, and
# publishes changed table slices to D1 and the current-week payloads to KV.
# It never deploys the Worker and never sees the SharpAPI key.
#
# What it can write, and when:
#   - A push never runs it. It has no push trigger.
#   - On its schedule it builds and tests, and publishes NOTHING unless the
#     repository variable NFL_SCHEDULED_PUBLISH is exactly "true". Set that
#     only after a supervised publish has succeeded and the archive bucket
#     exists: a scheduled publish always includes the source archive (r2).
#   - Run by hand it publishes only what the "publish" input names (default: none).
#   - Any publish also needs the two repository secrets:
#       CLOUDFLARE_API_TOKEN   limited to this account's D1, Workers KV and R2 (edit)
#       CLOUDFLARE_ACCOUNT_ID
#     Without them it builds, runs its checks, and publishes nothing.
name: NFL builder

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (default: the current one)"
        required: false
      publish:
        description: "Where to publish: none / r2,d1,kv / d1"
        required: false
        default: "none"
  schedule:
    # Every day at 08:20 UTC: after nflverse's 07:00 UTC roster, injury and depth-chart refresh.
    - cron: "20 8 * * *"
    # Tuesday 10:30 UTC: the weekly build, once Monday night's game is in the play-by-play.
    - cron: "30 10 * * 2"

permissions:
  contents: read

concurrency:
  group: nfl-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: NFL tests
        run: node --test test/nfl-*.test.mjs
      - name: Build and publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEASON: ${{ inputs.season }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish || 'none') || (vars.NFL_SCHEDULED_PUBLISH == 'true' && 'r2,d1,kv' || 'none') }}
        run: |
          ARGS=""
          if [ -n "$SEASON" ]; then ARGS="--season $SEASON"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ "$PUBLISH" = "none" ]; then
            echo "Building without publishing."
            node etl/nfl/build.mjs $ARGS
          else
            node etl/nfl/build.mjs $ARGS --publish "$PUBLISH"
          fi
      - name: Keep the build manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-build-manifest
          path: etl/nfl/out/archive/manifest.json
          retention-days: 14
          if-no-files-found: ignore
