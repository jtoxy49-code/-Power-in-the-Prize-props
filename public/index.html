<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PWR Props</title>
<meta name="description" content="PWR Props: MLB pitcher prop research for Power in the Prize Premium members.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0612">
<link rel="icon" type="image/png" href="/assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://img.mlbstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/shell.css">
<link rel="stylesheet" href="/assets/css/views.css">
<link rel="stylesheet" href="/assets/css/detail.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="PWR Props">
    <div class="brand-row">
      <a class="brand" href="/" data-link aria-label="PWR Props home">
        <img class="brand-mark" src="/assets/img/pwr-mark-96.png" width="30" height="30" alt="">
        <span class="brand-word">PWR <b>PROPS</b></span>
      </a>
      <button class="icon-btn rail-toggle" id="rail-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebar"></button>
    </div>
    <nav aria-label="Main">
      <a class="nav-item" href="/" data-link data-nav="home" title="Home"><span data-icon="house"></span><span class="nav-text">Home</span></a>
      <div class="nav-label">MLB</div>
      <div class="nav-sep" aria-hidden="true"></div>
      <a class="nav-item" href="/?view=board" data-link data-nav="board" title="Pitcher props"><span data-icon="rows"></span><span class="nav-text">Pitcher props</span><span class="nav-count" id="nav-props-count"></span></a>
      <a class="nav-item" href="/?view=matchups" data-link data-nav="matchups" title="Lineup matchups"><span data-icon="users-three"></span><span class="nav-text">Lineup matchups</span></a>
      <div class="nav-label">Coming soon</div>
      <div class="nav-sep" aria-hidden="true"></div>
      <span class="nav-item" aria-disabled="true" title="NFL props, coming soon"><span data-icon="lock-simple"></span><span class="nav-text">NFL props</span><span class="soon">Soon</span></span>
      <span class="nav-item" aria-disabled="true" title="NBA props, coming soon"><span data-icon="lock-simple"></span><span class="nav-text">NBA props</span><span class="soon">Soon</span></span>
    </nav>
    <div class="side-foot">
      <div class="fresh" id="side-fresh" aria-live="polite"><span data-icon="clock"></span><span class="fresh-text">Checking odds…</span></div>
      <div class="account">
        <div class="avatar" id="side-avatar" aria-hidden="true">?</div>
        <div class="account-meta">
          <div class="account-name" id="side-username">Member</div>
          <div class="account-tier"><span data-icon="crown-simple"></span>Premium</div>
        </div>
        <a class="icon-btn signout" href="/logout" aria-label="Sign out" title="Sign out"><span data-icon="sign-out"></span></a>
      </div>
    </div>
  </aside>

  <header class="topbar" id="topbar">
    <a class="brand" href="/" data-link aria-label="PWR Props home" id="topbar-brand">
      <img class="brand-mark" src="/assets/img/pwr-mark-96.png" width="26" height="26" alt="">
      <span class="brand-word">PWR <b>PROPS</b></span>
    </a>
    <span class="spacer"></span>
    <button class="icon-btn" id="account-btn" type="button" aria-label="Account" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu">
      <span class="avatar" id="top-avatar" aria-hidden="true">?</span>
    </button>
  </header>
  <div class="menu" id="account-menu" hidden>
    <div class="account">
      <div class="account-meta">
        <div class="account-name" id="menu-username">Member</div>
        <div class="account-tier"><span data-icon="crown-simple"></span>Premium</div>
      </div>
    </div>
    <div class="fresh" id="menu-fresh"><span data-icon="clock"></span><span class="fresh-text"></span></div>
    <a class="btn btn-quiet" href="/logout">Sign out</a>
  </div>

  <main class="main" id="main" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="Main">
    <a href="/" data-link data-nav="home"><span data-icon="house"></span>Home</a>
    <a href="/?view=board" data-link data-nav="board"><span data-icon="rows"></span>Props</a>
    <a href="/?view=matchups" data-link data-nav="matchups"><span data-icon="users-three"></span>Matchups</a>
  </nav>
</div>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
